<section class="hg-content-panel hg-content-panel--dns-zone" aria-live="polite">
    {tmpl_if name='rendered_zone'}
        <p class="hg-section-heading">{tmpl_var name='rendered_zone_txt'}</p>
        <pre class="hg-code-surface">{tmpl_var name='rendered_zone'}</pre>
    {tmpl_else}
        <div class="hg-alert hg-alert--info">{tmpl_var name='rendered_zone_unavailable_txt'}</div>
    {/tmpl_if}
</section>

<div class="hg-form-hidden">
    <input type="hidden" name="id" value="{tmpl_var name='id'}">
</div>
