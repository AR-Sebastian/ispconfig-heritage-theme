<!-- WP-940 Bootstrap-removal: native Workbench override; shared template unchanged. -->
<div class="wb-field-group">
	<label for="data">{tmpl_var name='public_key_txt'}</label>
	<tmpl_if name="edit_disabled">
		<div><textarea class="form-control" readonly name="data" id="data">{tmpl_var name='public_key'}</textarea></div>
	<tmpl_else>
		<div><textarea class="form-control" name="data" id="data">{tmpl_var name='public_key'}</textarea></div>
	</tmpl_if>
</div>
<div class="wb-field-group">
	<label for="selector">{tmpl_var name='selector_txt'}</label>
	<tmpl_if name="edit_disabled">
		<div><input type="text" name="selector" id="selector" value="{tmpl_var name='selector'}" readonly class="form-control" /></div>
	<tmpl_else>
		<div><input type="text" name="selector" id="selector" value="{tmpl_var name='selector'}" class="form-control" /></div>
	</tmpl_if>
</div>
<div class="wb-field-group">
	<label for="ttl">{tmpl_var name='ttl_txt'}</label>
	<div><input type="text" name="ttl" id="ttl" value="{tmpl_var name='ttl'}" class="form-control" /></div>
</div>
<div class="wb-field-group">
	<label>{tmpl_var name='active_txt'}</label>
	<div>{tmpl_var name='active'}</div>
</div>

<input type="hidden" name="id" value="{tmpl_var name='id'}">
<input type="hidden" name="zone" value="{tmpl_var name='zone'}" id="zone">
<input type="hidden" name="type" value="{tmpl_var name='type'}">
<input type="hidden" name="name" value="{tmpl_var name='name'}">

<div class="wb-form-actions">
	<button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="dns/dns_dkim_edit.php">{tmpl_var name='btn_save_txt'}</button>
	<button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="dns/dns_soa_edit.php?id={tmpl_var name='zone'}&next_tab=dns_records" data-load-content="dns/dns_soa_edit.php?id={tmpl_var name='zone'}&next_tab=dns_records">{tmpl_var name='btn_cancel_txt'}</button>
</div>
