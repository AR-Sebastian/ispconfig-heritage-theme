<!-- WP-946: native Workbench access form; shared template and server lifecycle unchanged. -->
<div class="wb-field-group">
    <tmpl_if name="edit_disabled">
        <label for="parent_domain_id">{tmpl_var name='parent_domain_id_txt'}</label>
        <div class="wb-field-body">
            <select name="parent_domain_id" id="parent_domain_id" class="form-control" disabled="disabled" data-json-sync="cron-placeholders" data-endpoint-name="sitesJson" data-request-type="getcronplaceholders" data-domain-not-selected="{tmpl_var name='domain_not_selected_placeholder_txt'}" data-jailed-title="{tmpl_var name='is_jailed_txt'}">
                {tmpl_var name='parent_domain_id'}
            </select>
            <span class="jail-symbol" title="{tmpl_var name='is_jailed_txt'}"><i class="fa fa-lock"></i></span>
        </div>
        <input type="hidden" name="parent_domain_id" value="{tmpl_var name='parent_domain_id_value'}" />
        <tmpl_else>
            <label for="parent_domain_id">{tmpl_var name='parent_domain_id_txt'}</label>
            <div class="wb-field-body">
                <select name="parent_domain_id" id="parent_domain_id" class="form-control" data-json-sync="cron-placeholders" data-endpoint-name="sitesJson" data-request-type="getcronplaceholders" data-domain-not-selected="{tmpl_var name='domain_not_selected_placeholder_txt'}" data-jailed-title="{tmpl_var name='is_jailed_txt'}">
                    {tmpl_var name='parent_domain_id'}
                </select>
                <span class="jail-symbol" title="{tmpl_var name='is_jailed_txt'}"><i class="fa fa-lock"></i></span>
            </div>
    </tmpl_if>
</div>

            <div class="wb-field-group">
                <label for="run_min">{tmpl_var name='run_min_txt'}</label>
                <div class="wb-field-body">
					<input type="text" name="run_min" id="run_min" value="{tmpl_var name='run_min'}" class="form-control" />
					<p class="formHint">e.g. *, */3, 10-20</p>
				</div>
            </div>
            <div class="wb-field-group">
                <label for="run_hour">{tmpl_var name='run_hour_txt'}</label>
                <div class="wb-field-body">
					<input type="text" name="run_hour" id="run_hour" value="{tmpl_var name='run_hour'}" class="form-control" />
					<p class="formHint">e.g. *, */2, 0, 10-12</p>
				</div>
            </div>
            <div class="wb-field-group">
                <label for="run_mday">{tmpl_var name='run_mday_txt'}</label>
                <div class="wb-field-body">
					<input type="text" name="run_mday" id="run_mday" value="{tmpl_var name='run_mday'}" class="form-control" />
					<p class="formHint">e.g. *, */4, 1-5</p>
				</div>
            </div>
            <div class="wb-field-group">
                <label for="run_month">{tmpl_var name='run_month_txt'}</label>
                <div class="wb-field-body">
					<input type="text" name="run_month" id="run_month" value="{tmpl_var name='run_month'}" class="form-control" />
					<p class="formHint">e.g. *, 1-6</p>
				</div>
            </div>
            <div class="wb-field-group">
                <label for="run_wday">{tmpl_var name='run_wday_txt'}</label>
                <div class="wb-field-body">
					<input type="text" name="run_wday" id="run_wday" value="{tmpl_var name='run_wday'}" class="form-control" />
					<p class="formHint">e.g. *, 0, 1-5</p>
				</div>
            </div>
            <div class="wb-field-group">
                <label for="command">{tmpl_var name='command_txt'}</label>
                <div class="wb-field-body">
					<input type="text" name="command" id="command" value="{tmpl_var name='command'}" class="form-control" />
                    <b>{tmpl_var name='variables_txt'}:</b>
                                       <a href="#" data-workbench-noop="true" data-workbench-tooltip="true" id="php_cli_binary" title="{tmpl_var name='php_cli_binary'}" class="addPlaceholder">{SITE_PHP}</a>,
                                       <a href="#" data-workbench-noop="true" data-workbench-tooltip="true" id="docroot_client" title="{tmpl_var name='docroot_client'}" class="addPlaceholder">{DOCROOT_CLIENT}</a>,
                                       <a href="#" data-workbench-noop="true" data-workbench-tooltip="true" id="domain" title="{tmpl_var name='domain'}" class="addPlaceholder">{DOMAIN}</a>
                                       <br><br><p class="formHint">{tmpl_var name='command_hint_txt'}</p>
				</div>
            </div>
            <div class="wb-field-group">
                <label>{tmpl_var name='log_output_txt'}</label>
                <div class="wb-field-body">
                    {tmpl_var name='log'}
                </div>
            </div>
            <div class="wb-field-group">
                <label>{tmpl_var name='active_txt'}</label>
                <div class="wb-field-body">
                    {tmpl_var name='active'}
                </div>
            </div>
        <input type="hidden" name="id" value="{tmpl_var name='id'}">

        <div class="wb-form-actions"><div class="wb-form-actions__primary">
            <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="sites/cron_edit.php">{tmpl_var name='btn_save_txt'}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="sites/cron_list.php" data-load-content="sites/cron_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div></div>
