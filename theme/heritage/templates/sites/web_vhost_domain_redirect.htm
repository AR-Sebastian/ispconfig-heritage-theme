<!-- WP-948: native Workbench website core surface; shared lifecycle unchanged. -->
<tmpl_if name="config_error_msg">
    <div>
        <p>
          <div id="errormsg" class="wb-alert wb-alert--danger wb-alert--dismissible" role="alert" data-wb-ack-url="sites/message_ack.php?relation=web_domain:{tmpl_var name='id'}&amp;_csrf_id={tmpl_var name='_csrf_id_msg'}&amp;_csrf_key={tmpl_var name='_csrf_key_msg'}">
            <button type="button" class="wb-alert__dismiss" data-workbench-dismiss="alert" aria-label="Schließen" data-wb-i18n-aria-label-de="Schließen" data-wb-i18n-aria-label-en="Close"><span aria-hidden="true">&times;</span></button>
            <div class="wb-config-error-time">{tmpl_var name='config_error_tstamp'} :&nbsp;</div>
            <div class="wb-config-error-message">{tmpl_var name='config_error_msg'}</div>
          </div>
        </p>
      </div>
  </tmpl_if>



            <div class="wb-field-group">
                <label for="redirect_type">{tmpl_var name='redirect_type_txt'}</label>
                <div class="wb-field-body"><select name="redirect_type" id="redirect_type" class="form-control">
                    {tmpl_var name='redirect_type'}
                </select></div>
            </div>
            <div class="wb-field-group">
                <label for="redirect_path">{tmpl_var name='redirect_path_txt'}</label>
                <div class="wb-field-body"><input type="text" name="redirect_path" id="redirect_path" value="{tmpl_var name='redirect_path'}" class="form-control" /></div></div>
            <div class="wb-field-group">
                <label for="seo_redirect">{tmpl_var name='seo_redirect_txt'}</label>
                <div class="wb-field-body"><select name="seo_redirect" id="seo_redirect" class="form-control">
                    {tmpl_var name='seo_redirect'}
                </select></div>
            </div>
			<div class="wb-field-group nginx">
                <label for="rewrite_rules">{tmpl_var name='rewrite_rules_txt'}</label>
                <div class="wb-field-body"><textarea class="form-control" name="rewrite_rules" id="rewrite_rules" rows='10' cols='50'>{tmpl_var name='rewrite_rules'}</textarea>
                    <b>{tmpl_var name="allowed_rewrite_rule_directives_txt"}</b>&nbsp;break&nbsp;if&nbsp;return&nbsp;rewrite&nbsp;set<br />&nbsp;<a href="https://nginx.org/docs/http/ngx_http_rewrite_module.html" target="_blank">https://nginx.org/docs/http/ngx_http_rewrite_module.html</a></div>
            </div>
			<tmpl_if name="is_ssl_enabled" op="==" value="y">
			<div class="wb-field-group">
				<label>{tmpl_var name='rewrite_to_https_txt'}</label>
				<div class="wb-field-body">
					{tmpl_var name="rewrite_to_https"}
				</div>
			</div>
			</tmpl_if>

        <input type="hidden" name="id" value="{tmpl_var name='id'}" data-json-sync="sites-vhost-redirect">

        <div class="wb-form-actions"><div class="wb-form-actions__primary">
            <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="sites/web_vhost_domain_edit.php">{tmpl_var name='btn_save_txt'}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="sites/web_vhost_domain_list.php" data-load-content="sites/web_vhost_domain_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div></div>
