<h1><tmpl_var name="list_head_txt">Import DNS records from Tupa PowerDNS controlpanel</h1>
<p><tmpl_var name="list_desc_txt"></p>


            <div class="wb-field-group">
                <label class="wb-field-label" for="dbhost">Tupa database hostname</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="dbhost" value="{tmpl_var name='dbhost'}" name="dbhost" /></div>
            </div>
            <div class="wb-field-group">
                <label class="wb-field-label" for="dbname">Tupa database name</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="dbname" value="{tmpl_var name='dbname'}" name="dbname" /></div>
            </div>
            <div class="wb-field-group">
                <label class="wb-field-label" for="dbuser">Tupa database user</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="dbuser" value="{tmpl_var name='dbuser'}" name="dbuser" /></div>
            </div>
            <div class="wb-field-group">
                <label class="wb-field-label" for="dbpassword">Tupa database password</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="dbpassword" value="{tmpl_var name='dbpassword'}" name="dbpassword" /></div>
            </div>
            <div class="wb-field-group">
                <label class="wb-field-label" for="dboptions">Tupa database options</label>
                <div class="wb-field-body" id="dboptions">
                    <label class="wb-option-inline" for="dbssl"><input type="checkbox" id="dbssl" value="1" name="dbssl" <tmpl_if name='dbssl' op='==' value='true'>checked</tmpl_if>/> Use SSL</label>
                </div>
            </div>

        <tmpl_if name="msg">
            <div id="OKMsg" class="wb-alert wb-alert--success" role="status"><div class="wb-alert__body"><tmpl_var name="msg"></div></div>
        </tmpl_if>
        <tmpl_if name="error">
          <div class='wb-alert wb-alert--danger' role='alert'>
            <div class='wb-alert__title'>
              <strong><tmpl_var name="error_txt"></strong>
              </div>
            <div class='wb-alert__body'>
              <ul class="wb-clean-list">
                <tmpl_var name="error">
              </ul>
            </div>
          </div>
        </tmpl_if>

        <input type="hidden" name="id" value="{tmpl_var name='id'}">
		<input type="hidden" name="start" value="1">

        <div class="wb-form-actions">
            <button class="formbutton-success" type="button" value="Import" data-submit-form="pageForm" data-form-action="tools/dns_import_tupa.php">Start</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="tools/index.php" data-load-content="tools/index.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div>
