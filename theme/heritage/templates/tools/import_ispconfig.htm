<!-- WP-970: native Workbench tools surface; controller contract unchanged. -->
<div class='page-header'>
	<h1><tmpl_var name="head_txt"></h1>
</div>
<p><tmpl_var name="list_desc_txt"></p>

<div class="wb-content-panel panel_language_import wb-spacious-panel">
    <div class="wb-form-surface">
        <legend>{tmpl_var name="legend_txt"}</legend>
            <div class="wb-field-group">
                <label class="wb-field-label">Remote API URL</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="remote_server" value="{tmpl_var name='remote_server'}" placeholder="https://www.example.com:8080/remote/" name="remote_server" /></div>
            </div>
            <div class="wb-field-group">
                <label class="wb-field-label">Remote User</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="remote_user" value="{tmpl_var name='remote_user'}" name="remote_user" /></div>
            </div>
            <div class="wb-field-group">
                <label class="wb-field-label">Remote password</label>
                <div class="wb-field-body"><input class="form-control" type="text" id="remote_password" value="{tmpl_var name='remote_password'}" name="remote_password" /></div>
            </div>

    </div>
    <tmpl_if name="connected">
        <div class="wb-form-surface">
            <legend>{tmpl_var name="legend2_txt"}</legend>
                <div class="wb-field-group">
                    <label for="mail_domain" class="wb-field-label">{tmpl_var name='mail_domain_txt'}</label>
                    <div class="wb-field-body"><select name="mail_domain" id="mail_domain" class="form-control">
                        {tmpl_var name='mail_domain'}
                    </select></div>
                </div>
                <div class="wb-field-group">
                    <label for="client_group_id" class="wb-field-label">{tmpl_var name='client_group_id_txt'}</label>
                    <div class="wb-field-body"><select name="client_group_id" id="client_group_id" class="form-control">
                        {tmpl_var name='client_group_id'}
                    </select></div>
                </div>
                <div class="wb-field-group">
                    <label for="local_server_id" class="wb-field-label">{tmpl_var name='local_server_txt'}</label>
                    <div class="wb-field-body"><select name="local_server_id" id="local_server_id" class="form-control">
                        {tmpl_var name='local_server_id'}
                    </select></div>
                </div>
                <div class="wb-field-group">
                    <label class="wb-field-label">{tmpl_var name="import_mailbox_txt"}</label>
                    <div class="wb-field-body"><input class="form-control" type="checkbox" id="import_mailbox" value="1" name="import_mailbox" checked="checked" /></div>
                </div>
                <div class="wb-field-group">
                    <label class="wb-field-label">{tmpl_var name="import_user_filter_txt"}</label>
                    <div class="wb-field-body"><input class="form-control" type="checkbox" id="import_user_filter" value="1" name="import_user_filter" checked="checked" /></div>
                </div>
                <div class="wb-field-group">
                    <label class="wb-field-label">{tmpl_var name="import_spamfilter_txt"}</label>
                    <div class="wb-field-body"><input class="form-control" type="checkbox" id="import_spamfilter" value="1" name="import_spamfilter" checked="checked" /></div>
                </div>
                <div class="wb-field-group">
                    <label class="wb-field-label">{tmpl_var name="import_alias_txt"}</label>
                    <div class="wb-field-body"><input class="form-control" type="checkbox" id="import_alias" value="1" name="import_alias" checked="checked" /></div>
                </div>
                <div class="wb-field-group">
                    <label class="wb-field-label">{tmpl_var name="import_forward_txt"}</label>
                    <div class="wb-field-body"><input class="form-control" type="checkbox" id="import_forward" value="1" name="import_forward" checked="checked" /></div>
                </div>
                <div class="wb-field-group">
                    <label class="wb-field-label">{tmpl_var name="import_aliasdomain_txt"}</label>
                    <div class="wb-field-body"><input class="form-control" type="checkbox" id="import_aliasdomain" value="1" name="import_aliasdomain" checked="checked" /></div>
                </div>

        </div>
    </tmpl_if>

    <tmpl_if name="msg">
        <div id="OKMsg" class="wb-alert wb-alert--success" role="status"><div class="wb-alert__body"><tmpl_var name="msg"></div></div>
    </tmpl_if>
    <tmpl_if name="error">
			<div class='wb-alert wb-alert--danger' role='alert'>
				<div class='wb-alert__title'>
					<strong><tmpl_var name="error_txt"></strong>
					</div>
				<div class='wb-alert__body'>
					<ul class="wb-clean-list">
						<tmpl_var name="error">
					</ul>
				</div>
			</div>
    </tmpl_if>

    <input type="hidden" name="remote_session_id" value="{tmpl_var name='remote_session_id'}">
    <input type="hidden" name="connected" value="{tmpl_var name='connected'}">
    <tmpl_if name="connected">
        <div class="wb-form-actions">
            <button class="formbutton-success" type="button" value="Import" data-submit-form="pageForm" data-form-action="tools/import_ispconfig.php">{tmpl_var name="btn_start_txt"}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="tools/index.php" data-load-content="tools/index.php">{tmpl_var name="btn_cancel_txt"}</button>
        </div>
    <tmpl_else>
        <div class="wb-form-actions">
            <button class="formbutton-success" type="button" value="Import" data-submit-form="pageForm" data-form-action="tools/import_ispconfig.php">{tmpl_var name="btn_connect_txt"}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="tools/index.php" data-load-content="tools/index.php">{tmpl_var name="btn_cancel_txt"}</button>
        </div>
    </tmpl_if>
  </div>
