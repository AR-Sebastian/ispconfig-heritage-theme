<div class="wb-field-group">
  <label for="passwort" class="wb-field-label">{tmpl_var name='password_txt'}</label>
  <div class="wb-field-body">
    <div class="wb-field-composite">
      <input type="password" name="passwort" id="passwort" value="{tmpl_var name='passwort'}" class="form-control" autocomplete="off" data-heritage-password-check="passwort:repeat_password" data-heritage-password-strength="true" />
      <span class="wb-input-group-actions">
        <button class="wb-input-group-action formbutton-default" type="button" data-generate-password="true" data-password-field="passwort" data-repeat-password-field="repeat_password">{tmpl_var name='generate_password_txt'}</button>
      </span>
    </div>
  </div>
</div>
<div class="wb-field-group">
  <label class="wb-field-label">{tmpl_var name='password_strength_txt'}</label>
  <div class="wb-field-body checkbox">
    <div id="passBar"></div>
    <span id="passText">&nbsp;</span>
  </div>
</div>
<div class="wb-field-group">
  <label for="repeat_password" class="wb-field-label">{tmpl_var name='repeat_password_txt'}</label>
  <div class="wb-field-body"><input type="password" name="repeat_password" id="repeat_password" value="" class="form-control" autocomplete="off" data-heritage-password-check="passwort:repeat_password" /></div>
</div>
<div class="wb-field-group">
  <div class="wb-field-body wb-field-body--offset">
    <div id="confirmpasswordError" hidden class="confirmpassworderror">{tmpl_var name='password_mismatch_txt'}</div>
    <div id="confirmpasswordOK" hidden class="confirmpasswordok">{tmpl_var name='password_match_txt'}</div>
  </div>
</div>
<div class="wb-field-group">
  <label for="otp_type" class="wb-field-label">{tmpl_var name='otp_auth_txt'}</label>
  <div class="wb-field-body">
    <select name="otp_type" id="otp_type" class="form-control">
      {tmpl_var name='otp_type'}
    </select>
  </div>
</div>
<div class="wb-field-group">
  <label for="language" class="wb-field-label">{tmpl_var name='language_txt'}</label>
  <div class="wb-field-body"><select name="language" id="language" class="form-control flags">
    {tmpl_var name='language'}
    </select>
  </div>
</div>
<div class="wb-field-group">
  <label for="app_theme" class="wb-field-label">{tmpl_var name='app_theme_txt'}</label>
  <div class="wb-field-body"><select name="app_theme" id="app_theme" class="form-control">
    {tmpl_var name='app_theme'}
    </select>
  </div>
</div>
<div class="wb-field-group">
  <label for="startmodule" class="wb-field-label">{tmpl_var name='startmodule_txt'}</label>
  <div class="wb-field-body"><select name="startmodule" id="startmodule" class="form-control">
    {tmpl_var name='startmodule'}
    </select>
  </div>
</div>
<input type="hidden" name="id" value="{tmpl_var name='id'}">
<div class="wb-form-actions">
  <div class="wb-form-actions__primary">
    <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="tools/user_settings.php">{tmpl_var name='btn_save_txt'}</button>
    <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-heritage-load-content="tools/index.php" data-load-content="tools/index.php">{tmpl_var name='btn_cancel_txt'}</button>
  </div>
</div>
