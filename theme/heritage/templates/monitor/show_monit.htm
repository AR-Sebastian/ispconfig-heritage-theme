<section class="hg-monitor-workspace">
    <header class="hg-monitor-hero">
        <span class="hg-module-eyebrow">ISPConfig Monitor</span>
        <h1><tmpl_var name="list_head_txt"></h1>
        <p><tmpl_var name="list_desc_txt"></p>
    </header>
    <div class="hg-monitor-embed">
        <tmpl_if name='monit_url'>
            <iframe src="{tmpl_var name='monit_url'}" title="{tmpl_var name='list_head_txt'}"></iframe>
        <tmpl_else>
            <div class="hg-monitor-empty" role="status"><p>{tmpl_var name="no_monit_url_defined_txt"} {tmpl_var name="no_permissions_to_view_monit_txt"}</p></div>
        </tmpl_if>
    </div>
</section>
