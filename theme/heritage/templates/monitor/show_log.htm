<section class="hg-monitor-workspace">
    <header class="hg-monitor-hero">
        <span class="hg-module-eyebrow">ISPConfig Monitor</span>
        <h1><tmpl_var name="list_head_txt"></h1>
        <p><tmpl_var name="list_desc_txt"></p>
    </header>

    <div class="hg-content-panel hg-content-panel--monitor">
        <div class="hg-field-group">
            <div class="hg-field-span hg-field-span--full">
                <label for="refreshinterval"><tmpl_var name="monTransRefreshsq"></label>
                <select
                    name="refreshinterval"
                    id="refreshinterval"
                    class="form-control"
                    data-load-content-refresh="monitor/show_log.php?log={tmpl_var name='log_id'}">
                    {tmpl_var name='refresh'}
                </select>
            </div>
        </div>

        <section class="hg-monitor-log" aria-label="<tmpl_var name='monTransDate'>">
            <header class="hg-monitor-log__header">
                <h2 class="hg-list-section-heading"><tmpl_var name="monTransDate"><tmpl_var name="time"></h2>
            </header>
            <div class="codeview hg-monitor-log__content">
                <pre><tmpl_var name="log_data"></pre>
            </div>
        </section>
    </div>
</section>
