<section class="hg-monitor-workspace">
    <header class="hg-monitor-hero">
        <span class="hg-module-eyebrow">ISPConfig Monitor</span>
        <h1><tmpl_var name="list_head_txt"></h1>
        <p><tmpl_var name="list_desc_txt"></p>
    </header>
    <section class="hg-monitor-refresh-panel" aria-labelledby="hg-monitor-refresh-title">
        <label id="hg-monitor-refresh-title" for="refreshinterval"><tmpl_var name="monTransRefreshsq"></label>
        <select name="refreshinterval" id="refreshinterval" class="form-control" data-load-content-refresh="monitor/show_sys_state.php?state={tmpl_var name="state_type"}">
            {tmpl_var name='refresh'}
        </select>
    </section>

    <section class="pnl_formarea hg-monitor-status-panel" aria-label="<tmpl_var name='list_head_txt'>">
        <div class="stateview"><tmpl_var name="state_data"></div>
    </section>

    <tmpl_if name="loadchart_data">
    <div class="pnl_formarea hg-monitor-chart-panel">
        <p class="hg-list-section-heading"><tmpl_var name="label_chart_title"></p>
        <div class="hg-monitor-chart-grid">
            <article class="hg-monitor-chart" data-heritage-chart-card>
                <header><span><tmpl_var name="loadchart_label"></span><strong data-heritage-chart-value="loadchart">&ndash;</strong></header>
                <div class="hg-monitor-chart__viewport"><canvas id="loadchart"></canvas></div>
                <button type="button" class="hg-monitor-chart__toggle" data-heritage-monitor-chart-toggle="loadchart" aria-expanded="false">Details</button>
                <dl class="hg-monitor-chart__details" data-heritage-monitor-chart-details="loadchart" hidden></dl>
            </article>
            <article class="hg-monitor-chart" data-heritage-chart-card>
                <header><span><tmpl_var name="memchart_label"></span><strong data-heritage-chart-value="memchart">&ndash;</strong></header>
                <div class="hg-monitor-chart__viewport"><canvas id="memchart"></canvas></div>
                <button type="button" class="hg-monitor-chart__toggle" data-heritage-monitor-chart-toggle="memchart" aria-expanded="false">Details</button>
                <dl class="hg-monitor-chart__details" data-heritage-monitor-chart-details="memchart" hidden></dl>
            </article>
            <article class="hg-monitor-chart" data-heritage-chart-card>
                <header><span><tmpl_var name="rxchart_label"></span><strong data-heritage-chart-value="rxchart">&ndash;</strong></header>
                <div class="hg-monitor-chart__viewport"><canvas id="rxchart"></canvas></div>
                <button type="button" class="hg-monitor-chart__toggle" data-heritage-monitor-chart-toggle="rxchart" aria-expanded="false">Details</button>
                <dl class="hg-monitor-chart__details" data-heritage-monitor-chart-details="rxchart" hidden></dl>
            </article>
            <article class="hg-monitor-chart" data-heritage-chart-card>
                <header><span><tmpl_var name="txchart_label"></span><strong data-heritage-chart-value="txchart">&ndash;</strong></header>
                <div class="hg-monitor-chart__viewport"><canvas id="txchart"></canvas></div>
                <button type="button" class="hg-monitor-chart__toggle" data-heritage-monitor-chart-toggle="txchart" aria-expanded="false">Details</button>
                <dl class="hg-monitor-chart__details" data-heritage-monitor-chart-details="txchart" hidden></dl>
            </article>
        </div>
    </div>
    <script type="application/json" data-heritage-monitor-chart-data>{tmpl_var name='monitor_chart_json'}</script>
    </tmpl_if>
</section>
