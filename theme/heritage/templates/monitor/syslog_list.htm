<!-- WP-965: native Workbench operations surface; controller contract unchanged. -->
<div class='page-header'>
	<h1>
		<tmpl_var name="list_head_txt">
	</h1>
</div>
<p>
	<tmpl_var name="list_desc_txt">
</p>

<a class="formbutton-danger"
		href="#" data-confirm-action="monitor/log_del.php?type=batch&loglevel=1&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='batch_delete_confirmation'}"><span
			class="icon icon-delete"></span> {tmpl_var name='batch_delete_warnings_txt'}</a>
	<a class="formbutton-danger"
		href="#" data-confirm-action="monitor/log_del.php?type=batch&loglevel=2&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='batch_delete_confirmation'}"><span
			class="icon icon-delete"></span> {tmpl_var name='batch_delete_errors_txt'}</a>
<p class="wb-list-section-heading">
	<tmpl_var name="list_head_txt">
</p>
<div class="wb-table-workspace">
	<table class="table wb-data-table">
		<thead >
			<tr>
				<th data-column="tstamp">
					<tmpl_var name="tstamp_txt">
				</th>
				<th data-column="server_id">
					<tmpl_var name="server_id_txt">
				</th>
				<th data-column="loglevel">
					<tmpl_var name="loglevel_txt">
				</th>
				<th data-column="message">
					<tmpl_var name="message_txt">
				</th>
				<th class="wb-table-actions-column wb-table-align-end">{tmpl_var name='search_limit'}</th>
			</tr>
			<tr>
				<td>&nbsp;</td>
				<td><select class="form-control" name="search_server_id">{tmpl_var name='search_server_id'}</select></td>
				<td><select class="form-control" name="search_loglevel">{tmpl_var name='search_loglevel'}</select></td>
				<td><input class="form-control" type="text" name="search_message" value="{tmpl_var name='search_message'}" /></td>
				<td class="wb-table-align-end">
					<button type="button" class="formbutton-default formbutton-narrow" name="Filter" id="Filter" value="{tmpl_var name=" filter_txt"}" data-submit-form="pageForm" data-form-action="monitor/log_list.php"><span
							class="icon icon-filter"></span></button>
				</td>
			</tr>
		</thead>
		<tbody>
			<tmpl_loop name="records">
				<tr>
					<td>{tmpl_var name="tstamp"}</td>
					<td>{tmpl_var name="server_id"}</td>
					<td>{tmpl_var name="loglevel"}</td>
					<td>{tmpl_var name="message"}</td>
					<td class="wb-table-align-end">
						<tmpl_if name="loglevel" op="==" value="Error">
							<a class="formbutton-danger formbutton-narrow"
								href="#" data-confirm-action="monitor/log_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span
									class="icon icon-delete"></span></a>
						</tmpl_if>
						<tmpl_if name="loglevel" op="==" value="Warning">
							<a class="formbutton-danger formbutton-narrow"
								href="#" data-confirm-action="monitor/log_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span
									class="icon icon-delete"></span></a>
						</tmpl_if>
					</td>
				</tr>
			</tmpl_loop>
			<tmpl_unless name="records">
				<tr class="tbl_row_noresults tbl_row_<tmpl_if name='__EVEN__'}even<tmpl_else>uneven</tmpl_if>">
					<td colspan="5">{tmpl_var name='globalsearch_noresults_text_txt'}</td>
				</tr>
			</tmpl_unless>
		</tbody>
		<tfoot>
			<tr>
				<td colspan="5">
					<tmpl_var name="paging">
				</td>
			</tr>
		</tfoot>
	</table>
</div>

</div>
