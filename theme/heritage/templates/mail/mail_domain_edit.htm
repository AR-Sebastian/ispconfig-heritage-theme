<!-- WP-955: native Workbench mail-domain form. Shared/default template remains untouched. -->
<tmpl_if name="is_admin">
    <div class="wb-field-group">
        <tmpl_if name="edit_disabled">
            <label for="server_id_disabled">{tmpl_var name='server_id_txt'}</label>
            <div><select name="server_id_disabled" id="server_id_disabled" class="form-control" disabled="disabled">{tmpl_var name='server_id'}</select></div>
            <input type="hidden" name="server_id" value="{tmpl_var name='server_id_value'}" />
        <tmpl_else>
            <label for="server_id">{tmpl_var name='server_id_txt'}</label>
            <div><select name="server_id" id="server_id" class="form-control">{tmpl_var name='server_id'}</select></div>
        </tmpl_if>
    </div>
    <tmpl_if name="domain_option">
        <div class="wb-field-group">
            <label for="server_id_disabled">{tmpl_var name='client_txt'}</label>
            <div><select name="server_id_disabled" id="server_id_disabled" class="form-control" disabled="disabled">{tmpl_var name='client_group_name'}</select></div>
        </div>
    <tmpl_else>
        <div class="wb-field-group">
            <label for="client_group_id">{tmpl_var name='client_txt'}</label>
            <div><select name="client_group_id" id="client_group_id" class="form-control">{tmpl_var name='client_group_id'}</select></div>
        </div>
    </tmpl_if>
<tmpl_else>
    <tmpl_if name="only_one_server">
        <input type="hidden" id="server_id" name="server_id" value="{tmpl_var name='server_id_value'}" />
    <tmpl_else>
        <div class="wb-field-group">
            <tmpl_if name="edit_disabled">
                <label for="server_id_disabled">{tmpl_var name='server_id_txt'}</label>
                <div><select name="server_id_disabled" id="server_id_disabled" class="form-control" disabled="disabled">{tmpl_var name='client_server_id'}</select></div>
                <input type="hidden" name="server_id" value="{tmpl_var name='server_id_value'}" />
            <tmpl_else>
                <label for="server_id">{tmpl_var name='server_id_txt'}</label>
                <div><select name="server_id" id="server_id" class="form-control">{tmpl_var name='client_server_id'}</select></div>
            </tmpl_if>
        </div>
    </tmpl_if>
</tmpl_if>

<tmpl_if name="is_reseller">
    <tmpl_unless name="domain_option">
        <div class="wb-field-group">
            <label for="client_group_id">{tmpl_var name='client_txt'}</label>
            <div><select name="client_group_id" id="client_group_id" class="form-control">{tmpl_var name='client_group_id'}</select></div>
        </div>
    </tmpl_unless>
</tmpl_if>

<div class="wb-field-group">
    <label for="domain">{tmpl_var name='domain_txt'}</label>
    <tmpl_if name="domain_option">
        <div><select name="domain" id="domain" class="form-control">{tmpl_var name='domain_option'}</select></div>
    <tmpl_else>
        <div><input type="text" name="domain" id="domain" value="{tmpl_var name='domain'}" class="form-control" /></div>
    </tmpl_if>
</div>
<div class="wb-field-group">
    <label for="policy">{tmpl_var name='policy_txt'}</label>
    <div><select name="policy" id="policy" class="form-control">{tmpl_var name='policy'}</select></div>
</div>

<tmpl_if name="show_per_domain_relay_options">
<tmpl_if name="limit_relayhost">
    <div class="wb-field-group">
        <label for="relay_host">{tmpl_var name='relayhost_txt'}</label>
        <div><input type="text" name="relay_host" id="relay_host" value="{tmpl_var name='relay_host'}" class="form-control" /></div>
    </div>
    <div class="wb-field-group">
        <label for="relay_user">{tmpl_var name='relayhost_user_txt'}</label>
        <div><input type="text" name="relay_user" id="relay_user" value="{tmpl_var name='relay_user'}" class="form-control" /></div>
    </div>
    <div class="wb-field-group">
        <label for="relay_pass">{tmpl_var name='relayhost_password_txt'}</label>
        <div><input type="text" name="relay_pass" id="relay_pass" value="{tmpl_var name='relay_pass'}" class="form-control" /></div>
    </div>
</tmpl_if>
</tmpl_if>

<div class="wb-field-group">
    <label>{tmpl_var name='active_txt'}</label>
    <div>{tmpl_var name='active'}</div>
</div>
<div class="wb-field-group">
    <label>{tmpl_var name='local_delivery_txt'}</label>
    <div>{tmpl_var name='local_delivery'}</div>
</div>

<tmpl_if name="domain_module">
    <input type="hidden" name="domain_module" value="1" id="domain_module" />
<tmpl_else>
    <input type="hidden" name="domain_module" value="0" id="domain_module" />
</tmpl_if>

<section class="wb-form-panel wb-form-panel--technical">
    <button class="formbutton-default wb-form-panel-trigger" type="button" data-workbench-collapse="true" data-target="#toggle-dkim" aria-expanded="false" aria-controls="toggle-dkim">
        {tmpl_var name='dkim_settings_txt'}
    </button>
    <div id="toggle-dkim" class="collapse wb-form-panel__body">
        <div class="wb-field-group">
            <label>{tmpl_var name='dkim_txt'}</label>
            <div>{tmpl_var name='dkim'}</div>
        </div>
        <div class="wb-field-group">
            <label for="dkim_selector">{tmpl_var name='dkim_selector_txt'}</label>
            <div><input type="text" name="dkim_selector" id="dkim_selector" value="{tmpl_var name='dkim_selector'}" class="form-control" /></div>
        </div>
        <div class="wb-field-group">
            <label for="dkim_private">{tmpl_var name='dkim_private_txt'}</label>
            <div><textarea class="form-control" name="dkim_private" id="dkim_private" rows="10" cols="30">{tmpl_var name='dkim_private'}</textarea></div>
        </div>
        <div class="wb-field-group wb-field-group--with-action">
            <span></span>
            <div><a class="formbutton-default" id="dkim-button" value="{tmpl_var name='dkim_generate_txt'}" href="#" data-workbench-action="create-dkim">{tmpl_var name='dkim_generate_txt'}</a></div>
        </div>
        <textarea class="form-control" name="dkim_public" hidden id="dkim_public" rows="5" cols="30" readonly>{tmpl_var name='dkim_public'}</textarea>
        <div class="wb-field-group">
            <label for="dns_record">{tmpl_var name='dkim_dns_txt'}<tmpl_if name='dkim_auto_dns'> <span class="fa fa-link" aria-hidden="false" title="{tmpl_var name='dkim_auto_dns'}"></span></tmpl_if></label>
            <div><textarea class="form-control" name="dns_record" id="dns_record" rows="10" cols="30" readonly>{tmpl_var name='dns_record'}</textarea></div>
        </div>
    </div>
</section>

<input type="hidden" name="id" value="{tmpl_var name='id'}">
<input type="hidden" name="type" value="local">
<div class="wb-form-actions">
    <tmpl_if name='id'><tmpl_if name='show_delete_on_forms' op="==" value="y">
        <a class="formbutton-danger formbutton-narrow" href="#" data-confirm-action="mail/mail_domain_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='_csrf_id'}&_csrf_key={tmpl_var name='_csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete"></span></a>
    </tmpl_if></tmpl_if>
    <div class="wb-form-actions__primary">
        <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="mail/mail_domain_edit.php">{tmpl_var name='btn_save_txt'}</button>
        <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="mail/mail_domain_list.php" data-load-content="mail/mail_domain_list.php">{tmpl_var name='btn_cancel_txt'}</button>
    </div>
</div>
