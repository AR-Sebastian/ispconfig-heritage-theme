<div class="hg-list-toolbar">
    <p class="hg-list-section-heading">{tmpl_var name="toolsarea_head_txt"}</p>

            <button class="formbutton-success" type="button" data-heritage-load-content="mail/mail_user_filter_edit.php?mailuser_id={tmpl_var name='parent_id'}" data-load-content="mail/mail_user_filter_edit.php?mailuser_id={tmpl_var name='parent_id'}">{tmpl_var name="add_new_record_txt"}</button>




    <p class="hg-list-section-heading"><tmpl_var name="list_head_txt"></p>
        <div class="hg-table-workspace">
<table class="table hg-data-table">
            <thead >
                <tr>
                    <th data-column="rulename"><tmpl_var name="rulename_txt"></th>
                    <th class="hg-table-align-end">{tmpl_var name='search_limit'}</th>
                </tr>
                <tr>
                    <td><input class="form-control" type="text" name="search_rulename" value="{tmpl_var name='search_rulename'}" /></td>
                    <td class="hg-table-align-end">
                        <button type="button" class="formbutton-default formbutton-narrow" name="Filter" id="Filter" value="{tmpl_var name="filter_txt"}" data-change-tab="filter_records" data-tab-target="mail/mail_user_edit.php"><span class="icon icon-filter"></span></button>
                    </td>
                </tr>
            </thead>
            <tbody>
                <tmpl_loop name="records">
                    <tr>
                        <td><a href="#" data-heritage-load-content="mail/mail_user_filter_edit.php?id={tmpl_var name='id'}" data-load-content="mail/mail_user_filter_edit.php?id={tmpl_var name='id'}">{tmpl_var name="rulename"}</a></td>
                        <td class="hg-table-align-end">
                            <a class="formbutton-danger formbutton-narrow" href="#" data-confirm-action="mail/mail_user_filter_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete"></span></a>
                        </td>
                    </tr>
                </tmpl_loop>
                <tmpl_unless name="records">
                    <tr class="tbl_row_noresults tbl_row_<tmpl_if name='__EVEN__'}even<tmpl_else>uneven</tmpl_if>">
                        <td colspan="2">{tmpl_var name='globalsearch_noresults_text_txt'}</td>
                    </tr>
                </tmpl_unless>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2"><tmpl_var name="paging"></td>
                </tr>
            </tfoot>
        </table>
</div>
