<!-- WP-956: native Workbench mailbox-filter form. -->
<div class="wb-field-group">
    <label for="rulename">{tmpl_var name='rulename_txt'}</label>
    <div><input type="text" id="rulename" name="rulename" value="{tmpl_var name='rulename'}" class="form-control"></div>
</div>
<div class="wb-field-group wb-field-group--multi-body">
    <label for="source">{tmpl_var name='source_txt'}</label>
    <div>
        <select id="source" name="source" class="form-control">{tmpl_var name='source'}</select>
        <select id="op" name="op" class="form-control" data-workbench-sync-visibility="regex_hint" data-visible-value="regex">{tmpl_var name='op'}</select>
        <input type="text" id="searchterm" name="searchterm" value="{tmpl_var name='searchterm'}" class="form-control">
        <small id="regex_hint" class="text-muted" hidden>{tmpl_var name='regex_hint_txt'}</small>
    </div>
</div>
<div class="wb-field-group wb-field-group--multi-body">
    <label for="action">{tmpl_var name='action_txt'}</label>
    <div>
        <select id="action" name="action" class="form-control">{tmpl_var name='action'}</select>
        <input type="text" id="target" name="target" value="{tmpl_var name='target'}" class="form-control">
    </div>
</div>
<div class="wb-field-group">
    <label for="active">{tmpl_var name='active_txt'}</label>
    <div><span>{tmpl_var name='active'}</span></div>
</div>
<input type="hidden" name="id" value="{tmpl_var name='id'}">
<input name="mailuser_id" type="hidden" value="{tmpl_var name='mailuser_id'}">
<div class="wb-form-actions">
    <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="mail/mail_user_filter_edit.php">{tmpl_var name='btn_save_txt'}</button>
    <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="mail/mail_user_edit.php?id={tmpl_var name='mailuser_id'}" data-load-content="mail/mail_user_edit.php?id={tmpl_var name='mailuser_id'}">{tmpl_var name='btn_cancel_txt'}</button>
</div>
