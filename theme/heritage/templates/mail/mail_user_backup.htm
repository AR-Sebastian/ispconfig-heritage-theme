<div class="wb-alert wb-alert--danger">
    <p>

          <div class="wb-config-error-time">{tmpl_var name='config_error_tstamp'} :&nbsp;</div>
          <div class="wb-config-error-message">{tmpl_var name='config_error_msg'}</div>
        </div>
    </p>
  </div>
</tmpl_if>

                    {tmpl_var name='backup_interval'}
                </select></div>
            </div>
            <div class="wb-field-group">
                <label for="backup_copies" class="wb-field-label">{tmpl_var name='backup_copies_txt'}</label>

                </select></div>
