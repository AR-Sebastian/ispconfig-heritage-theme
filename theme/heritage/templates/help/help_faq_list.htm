<!-- WP-970: native Workbench help surface; controller contract unchanged. -->
<section class="wb-content-panel wb-content-panel--faq" data-wb-support-surface="faq-library">
    <div class="wb-faq-list">
        <tmpl_loop name="records">
            <article class="wb-faq-item">
                <header class="wb-faq-item__header">
                    <h3>{tmpl_var name='hf_question'}</h3>
                    <tmpl_if name='is_admin'>
                        <div class="wb-faq-item__actions">
                            <a href="#" data-workbench-load-content="help/faq_edit.php?id={tmpl_var name='id'}" data-load-content="help/faq_edit.php?id={tmpl_var name='id'}">{tmpl_var name="edit_txt"}</a>
                            <a class="formbutton-danger formbutton-narrow" href="#" data-confirm-action="help/faq_delete.php?id={tmpl_var name='id'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete"></span></a>
                        </div>
                    </tmpl_if>
                </header>
                <div class="wb-faq-item__answer">{tmpl_var name='hf_answer'}</div>
            </article>
        </tmpl_loop>
    </div>
</section>
