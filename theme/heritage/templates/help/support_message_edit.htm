<section class="hg-content-panel hg-content-panel--form" data-heritage-support-surface="message-editor">
            <div class="hg-field-group">
                <label for="recipient_id">{tmpl_var name='recipient_id_txt'}</label>
                <div><select name="recipient_id" id="recipient_id" class="form-control">
                    {tmpl_var name='recipient_id'}
                </select></div>
            </div>
            <div class="hg-field-group">
                <label for="subject">{tmpl_var name='subject_txt'}</label>
                <div><input type="text" name="subject" id="subject" value="{tmpl_var name='subject'}" class="form-control" /></div>
            </div>
            <div class="hg-field-group">
                <label for="message">{tmpl_var name='message_txt'}</label>
                <div><textarea class="form-control" name="message" id="message" rows='10' cols='30'>{tmpl_var name='message'}</textarea></div>
            </div>

        <input type="hidden" name="id" value="{tmpl_var name='id'}">
        <input type="hidden" name="tstamp" value="{tmpl_var name='tstamp'}">

        <div class="hg-form-actions">
            <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="help/support_message_edit.php">{tmpl_var name='btn_save_txt'}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-heritage-load-content="help/support_message_list.php" data-load-content="help/support_message_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div>
</section>
