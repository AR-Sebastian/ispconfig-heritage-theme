<div class='page-header'>
	<h1><tmpl_var name="page_head_txt"></h1>
</div>

<div class="panel panel_mailuser">

  <div class="hg-form-surface">

        <div class="hg-field-group">
            <label class="hg-field-label">{tmpl_var name='email_txt'}</label>
            <div class="hg-field-body"><div class="checkbox">{tmpl_var name='email'}</div></div>
        </div>
        <div class="hg-field-group">
            <label class="hg-field-label">{tmpl_var name='login_txt'}</label>
            <div class="hg-field-body"><div class="checkbox">{tmpl_var name='login'}</div></div>
        </div>
        <div class="hg-field-group">
            <label class="hg-field-label">{tmpl_var name='server_address_txt'}</label>
            <div class="hg-field-body"><div class="checkbox">{tmpl_var name='server_name'}</div></div>
        </div>
        <div class="hg-field-group">
            <label class="hg-field-label">{tmpl_var name='quota_txt'}</label>
            <div class="hg-field-body"><div class="checkbox">{tmpl_var name='quota'}</div></div>
        </div>
        <div class="hg-field-group">
            <label class="hg-field-label">{tmpl_var name='cc_txt'}</label>
            <div class="hg-field-body"><div class="checkbox">{tmpl_var name='cc'}</div></div>
        </div>
        <div class="hg-form-actions">
            &nbsp;
        </div>

  </div>

</div>
