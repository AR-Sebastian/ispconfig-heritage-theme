<!-- WP-965: native Workbench operations surface; controller contract unchanged. -->
<div class='page-header'>
	<h1><tmpl_var name="list_head_txt"></h1>
</div>
<section class="wb-table-workspace">
    <div class="wb-list-toolbar">
        <div class="wb-list-toolbar__context">
            <span class="wb-list-toolbar__eyebrow">{tmpl_var name="toolsarea_head_txt"}</span>
            <strong><tmpl_var name="list_head_txt"></strong>
        </div>
        <button class="formbutton-success" type="button" data-workbench-load-content="admin/server_ip_edit.php" data-load-content="admin/server_ip_edit.php">{tmpl_var name="add_new_record_txt"}</button>
    </div>

<table class="table wb-data-table">
                <thead >
                    <tr>
                        <th data-column="server_id"><tmpl_var name="server_id_txt"></th>
                        <th class="wb-table-compact-column" data-column="client_id"><tmpl_var name="client_id_txt"></th>
                        <th data-column="ip_type"><tmpl_var name="ip_type_txt"></th>
                        <th data-column="ip_address"><tmpl_var name="ip_address_txt"></th>
                        <th data-column="virtualhost"><tmpl_var name="virtualhost_txt"></th>
                        <th data-column="virtualhost_port"><tmpl_var name="virtualhost_port_txt"></th>
                        <th class="wb-table-align-end">{tmpl_var name='search_limit'}</th>
                    </tr>
                    <tr>
                        <td><select class="form-control" name="search_server_id">{tmpl_var name='search_server_id'}</select></td>
                        <td><select class="form-control" name="search_client_id">{tmpl_var name='search_client_id'}</select></td>
                        <td><select class="form-control" name="search_ip_type">{tmpl_var name='search_ip_type'}</select></td>
                        <td><input class="form-control" type="text" name="search_ip_address" value="{tmpl_var name='search_ip_address'}" /></td>
                        <td><select class="form-control" name="search_virtualhost">{tmpl_var name='search_virtualhost'}</select></td>
                        <td><input class="form-control" type="text" name="search_virtualhost_port" value="{tmpl_var name='search_virtualhost_port'}" /></td>
                        <td class="wb-table-align-end">
                            <button type="button" class="formbutton-default formbutton-narrow" name="Filter" id="Filter" value="{tmpl_var name="filter_txt"}" data-submit-form="pageForm" data-form-action="admin/server_ip_list.php"><span class="icon icon-filter"></span></button>
                        </td>
                    </tr>
                </thead>
                <tbody>
                    <tmpl_loop name="records">
                        <tr>
                            <td><a href="#" data-workbench-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-workbench-tooltip="true" data-workbench-tooltip-placement="bottom" title="{tmpl_var name='server_id'}">{tmpl_var name="server_id"}</a></td>
                            <td><a href="#" data-workbench-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-workbench-tooltip="true" data-workbench-tooltip-placement="bottom" title="{tmpl_var name='client_id'}">{tmpl_var name="client_id"}</a></td>
                            <td><a href="#" data-workbench-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}">{tmpl_var name="ip_type"}</a></td>
                            <td><a href="#" data-workbench-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-workbench-tooltip="true" data-workbench-tooltip-placement="bottom" title="{tmpl_var name='ip_address'}">{tmpl_var name="ip_address"}</a></td>
                            <td><a href="#" data-workbench-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}">{tmpl_var name="virtualhost"}</a></td>
                            <td><a href="#" data-workbench-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}" data-load-content="admin/server_ip_edit.php?id={tmpl_var name='id'}">{tmpl_var name="virtualhost_port"}</a></td>
                            <td class="wb-table-align-end">
                                <a class="formbutton-danger formbutton-narrow" href="#" data-confirm-action="admin/server_ip_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete"></span></a>
                            </td>
                        </tr>
                    </tmpl_loop>
                    <tmpl_unless name="records">
                        <tr class="tbl_row_noresults tbl_row_<tmpl_if name='__EVEN__'}even<tmpl_else>uneven</tmpl_if>">
                            <td colspan="7">{tmpl_var name='globalsearch_noresults_text_txt'}</td>
                        </tr>
                    </tmpl_unless>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="7"><tmpl_var name="paging"></td>
                    </tr>
                </tfoot>
            </table>
</section>
