<section class="hg-extension-workspace" data-heritage-extension-page="message">
    <header class="hg-extension-hero">
        <span class="hg-module-eyebrow">ISPConfig</span>
        <h1><tmpl_var name="extension_heading_txt"></h1>
    </header>
    <section class="hg-content-panel">
        <div class="hg-alert hg-alert--success" role="status">
            <p><tmpl_var name="message_txt"></p>
            <tmpl_if name="info_text"><p><tmpl_var name="info_text"></p></tmpl_if>
        </div>
        <div class="hg-form-actions">
            <a class="formbutton-success" data-heritage-load-content="{tmpl_var name='next_link'}" data-load-content="{tmpl_var name='next_link'}"><tmpl_var name="btn_next_txt"> &gt;</a>
        </div>
    </section>
</section>
