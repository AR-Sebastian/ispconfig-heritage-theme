<!-- WP-965: native Workbench operations surface; controller contract unchanged. -->
<div class="wb-alert wb-alert--info wb-config-context"><h4><tmpl_var name="config_for_txt"> {tmpl_var name='server_name'}</h4></div>


        <legend>UFW Firewall</legend>
            <div class="wb-field-group">
                <label >{tmpl_var name='ufw_enable_txt'}</label>
                <div class="wb-field-body">
                    {tmpl_var name='ufw_enable'}
                </div>
            </div>
            <div class="wb-field-group">
                <label >{tmpl_var name='ufw_manage_builtins_txt'}</label>
                <div class="wb-field-body">
                    {tmpl_var name='ufw_manage_builtins'}
                </div>
            </div>
            <div class="wb-field-group">
                <label >{tmpl_var name='ufw_ipv6_txt'}</label>
                <div class="wb-field-body">
                    {tmpl_var name='ufw_ipv6'}
                </div>
            </div>
            <div class="wb-field-group">
                <label for="ufw_default_input_policy" >{tmpl_var name='ufw_default_input_policy_txt'}</label>
                <div class="wb-field-body"><select name="ufw_default_input_policy" id="ufw_default_input_policy" class="form-control">
                    {tmpl_var name='ufw_default_input_policy'}
                </select></div>
            </div>
            <div class="wb-field-group">
                <label for="ufw_default_output_policy" >{tmpl_var name='ufw_default_output_policy_txt'}</label>
                <div class="wb-field-body"><select name="ufw_default_output_policy" id="ufw_default_output_policy" class="form-control">
                    {tmpl_var name='ufw_default_output_policy'}
                </select></div>
            </div>
            <div class="wb-field-group">
                <label for="ufw_default_forward_policy" >{tmpl_var name='ufw_default_forward_policy_txt'}</label>
                <div class="wb-field-body"><select name="ufw_default_forward_policy" id="ufw_default_forward_policy" class="form-control">
                    {tmpl_var name='ufw_default_forward_policy'}
                </select></div>
            </div>
            <div class="wb-field-group">
                <label for="ufw_default_application_policy" >{tmpl_var name='ufw_default_application_policy_txt'}</label>
                <div class="wb-field-body"><select name="ufw_default_application_policy" id="ufw_default_application_policy" class="form-control">
                    {tmpl_var name='ufw_default_application_policy'}
                </select></div>
            </div>
            <div class="wb-field-group">
                <label for="ufw_log_level" >{tmpl_var name='ufw_log_level_txt'}</label>
                <div class="wb-field-body"><select name="ufw_log_level" id="ufw_log_level" class="form-control">
                    {tmpl_var name='ufw_log_level'}
                </select></div>
            </div>


        <input type="hidden" name="id" value="{tmpl_var name='id'}">

        <div class="wb-form-actions"><div class="wb-form-actions__primary">
            <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="admin/server_config_edit.php">{tmpl_var name='btn_save_txt'}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="admin/server_config_list.php" data-load-content="admin/server_config_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div></div>
