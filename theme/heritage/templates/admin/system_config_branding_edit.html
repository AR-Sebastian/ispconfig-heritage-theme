<!-- WP-1002: native Workbench branding surface; controller contract unchanged. -->
<div class="page-header">
    <h1><tmpl_var name="list_head_txt"></h1>
    <p><tmpl_var name="list_desc_txt"></p>
</div>

<section class="wb-content-panel wb-content-panel--branding">
    <div class="wb-field-group">
        <div class="wb-field-span wb-field-span--full">
            <span class="wb-field-label"><tmpl_var name="branding_txt">Branding</span>
            <label class="wb-choice-row" for="allow_themechange">
                <span>{tmpl_var name='allow_themechange_txt'}Allow users to change theme</span>
                <span class="wb-choice-row__control">{tmpl_var name='allow_themechange'}</span>
            </label>
        </div>
    </div>

    <input type="hidden" name="id" value="{tmpl_var name='id'}">
    <div class="wb-form-actions">
        <div class="wb-form-actions__primary">
            <button
                class="formbutton-success"
                type="button"
                value="{tmpl_var name='btn_save_txt'}"
                data-submit-form="pageForm"
                data-form-action="admin/system_config_edit.php">{tmpl_var name='btn_save_txt'}</button>
            <button
                class="formbutton-default"
                type="button"
                value="{tmpl_var name='btn_cancel_txt'}"
                data-workbench-load-content="admin/server_list.php"
                data-load-content="admin/server_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div>
    </div>
</section>
