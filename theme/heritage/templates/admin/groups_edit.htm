<!-- WP-926 Bootstrap-removal batch 2: native override of admin/groups_edit.
     Native wb-field-group / wb-form-actions structure; shared template untouched
     (keeps serving the default theme). All {tmpl_var} and data-* hooks verbatim. -->
<div class='page-header'>
	<h1><tmpl_var name="list_head_txt"></h1>
</div>
<p><tmpl_var name="list_desc_txt"></p>

            <div class="wb-field-group">
                <label for="name">{tmpl_var name='name_txt'}</label>
                <div><input type="text" name="name" id="name" value="{tmpl_var name='name'}" class="form-control" /></div>
            </div>
            <div class="wb-field-group">
                <label for="description">{tmpl_var name='description_txt'}</label>
                <div><textarea class="form-control" name="description" id="description" rows='5' cols='30'>{tmpl_var name='description'}</textarea></div>
            </div>

        <input type="hidden" name="id" value="{tmpl_var name='id'}">

        <div class="wb-form-actions">
            <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="admin/groups_edit.php">{tmpl_var name='btn_save_txt'}</button>
            <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="admin/groups_list.php" data-load-content="admin/groups_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div>
