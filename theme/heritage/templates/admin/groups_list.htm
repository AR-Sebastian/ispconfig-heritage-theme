<!-- WP-965: native Workbench operations surface; controller contract unchanged. -->
<div class='page-header'>
	<h1><tmpl_var name="list_head_txt"></h1>
</div>
<p><tmpl_var name="list_desc_txt"></p>
<section class="wb-table-workspace">
    <div class="wb-list-toolbar">
        <div class="wb-list-toolbar__context">
            <span class="wb-list-toolbar__eyebrow">{tmpl_var name="toolsarea_head_txt"}</span>
            <strong><tmpl_var name="list_head_txt"></strong>
        </div>
        <button class="formbutton-success" type="button" data-workbench-load-content="admin/groups_edit.php" data-load-content="admin/groups_edit.php">{tmpl_var name="add_new_record_txt"}</button>
    </div>
    <p><tmpl_var name="warning_txt"></p>

<table class="table wb-data-table">
                <thead >
                    <tr>
                        <th data-column="name"><tmpl_var name="name_txt"></th>
                        <th data-column="description"><tmpl_var name="description_txt"></th>
                        <th class="wb-table-align-end">&nbsp;</th>
                    </tr>
                    <tr>
                        <td><input class="form-control" type="text" name="search_name" value="{tmpl_var name='search_name'}" /></td>
                        <td><input class="form-control" type="text" name="search_description" value="{tmpl_var name='search_description'}" /></td>
                        <td class="wb-table-align-end">
                            <button type="button" class="formbutton-default formbutton-narrow" name="Filter" id="Filter" value="{tmpl_var name="filter_txt"}" data-submit-form="pageForm" data-form-action="admin/groups_list.php"><span class="icon icon-filter"></span></button>
                        </td>
                    </tr>
                </thead>
                <tbody>
                    <tmpl_loop name="records">
                        <tr>
                            <td><a href="#" data-workbench-load-content="admin/groups_edit.php?id={tmpl_var name='id'}" data-load-content="admin/groups_edit.php?id={tmpl_var name='id'}">{tmpl_var name="name"}</a></td>
                            <td><a href="#" data-workbench-load-content="admin/groups_edit.php?id={tmpl_var name='id'}" data-load-content="admin/groups_edit.php?id={tmpl_var name='id'}">{tmpl_var name="description"}</a></td>
                            <td class="wb-table-align-end">
                                <a class="formbutton-danger formbutton-narrow" href="#" data-confirm-action="admin/groups_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete"></span></a>
                            </td>
                        </tr>
                    </tmpl_loop>
                    <tmpl_unless name="records">
                        <tr class="tbl_row_noresults tbl_row_<tmpl_if name='__EVEN__'}even<tmpl_else>uneven</tmpl_if>">
                            <td colspan="3">{tmpl_var name='globalsearch_noresults_text_txt'}</td>
                        </tr>
                    </tmpl_unless>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3"><tmpl_var name="paging"></td>
                    </tr>
                </tfoot>
            </table>
</section>
