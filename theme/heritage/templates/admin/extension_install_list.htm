<!-- WP-992: native Workbench installed extensions list. -->
<section class="wb-extension-workspace" data-wb-extension-page="installed">
    <header class="wb-extension-hero">
        <span class="wb-module-eyebrow">ISPConfig</span>
        <h1><tmpl_var name="install_list_head_txt"></h1>
    </header>

    <tmpl_if name="has_pending_installs">
        <div class="wb-alert wb-alert--warning" role="status"><tmpl_var name="pending_installs_txt"></div>
    </tmpl_if>

    <section class="wb-table-workspace" aria-labelledby="wb-extension-installed-title">
        <div class="wb-list-toolbar">
            <div class="wb-list-toolbar__context">
                <strong id="wb-extension-installed-title"><tmpl_var name="install_list_head_txt"></strong>
            </div>
        </div>
        <table class="table wb-data-table">
            <thead>
                <tr>
                    <th data-column="active"><tmpl_var name="active_txt"></th>
                    <th data-column="server_id"><tmpl_var name="server_id_txt"></th>
                    <th data-column="name"><tmpl_var name="name_txt"></th>
                    <th data-column="version"><tmpl_var name="installed_version_txt"></th>
                    <th data-column="title"><tmpl_var name="title_txt"></th>
                    <th class="wb-table-actions-column wb-table-align-end"><span class="wb-visually-hidden"><tmpl_var name="delete_txt"></span></th>
                </tr>
            </thead>
            <tbody>
                <tmpl_if name="has_records">
                    <tmpl_loop name="records">
                        <tr>
                            <td data-wb-label="{tmpl_var name='active_txt'}"><a href="#" data-workbench-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}" data-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}">{tmpl_var name="active"}</a></td>
                            <td data-wb-label="{tmpl_var name='server_id_txt'}"><a href="#" data-workbench-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}" data-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}">{tmpl_var name="server_name"}</a></td>
                            <td data-wb-label="{tmpl_var name='name_txt'}"><a href="#" data-workbench-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}" data-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}">{tmpl_var name="name"}</a></td>
                            <td data-wb-label="{tmpl_var name='installed_version_txt'}"><a href="#" data-workbench-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}" data-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}">{tmpl_var name="version"}</a></td>
                            <td data-wb-label="{tmpl_var name='title_txt'}"><a href="#" data-workbench-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}" data-load-content="admin/extension_edit.php?name={tmpl_var name='name'}&action=edit&server_id={tmpl_var name='server_id'}">{tmpl_var name="title"}</a></td>
                            <td class="wb-table-align-end" data-wb-label="{tmpl_var name='delete_txt'}">
                                <button class="wb-row-action wb-row-action--danger" type="button" title="{tmpl_var name='delete_txt'}" aria-label="{tmpl_var name='delete_txt'}" data-confirm-action="admin/extension_edit.php?name={tmpl_var name='name'}&server_id={tmpl_var name='server_id'}&action=delete&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete" aria-hidden="true"></span></button>
                            </td>
                        </tr>
                    </tmpl_loop>
                    <tmpl_else>
                        <tr class="tbl_row_noresults"><td colspan="6"><tmpl_var name="no_records_txt"></td></tr>
                    </tmpl_if>
            </tbody>
        </table>
    </section>
</section>
