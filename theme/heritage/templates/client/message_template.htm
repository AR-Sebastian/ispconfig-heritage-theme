<!-- WP-961: native Workbench customer-message template form. -->
<section class="wb-form-panel">
    <div class="wb-field-group">
        <label for="template_type">{tmpl_var name='template_type_txt'}</label>
        <div><select name="template_type" id="template_type" class="form-control">{tmpl_var name='template_type'}</select></div>
    </div>
    <div class="wb-field-group">
        <label for="template_name">{tmpl_var name='template_name_txt'}</label>
        <div><input type="text" name="template_name" id="template_name" value="{tmpl_var name='template_name'}" class="form-control" /></div>
    </div>
    <div class="wb-field-group wb-field-group--with-help">
        <label for="subject">{tmpl_var name='subject_txt'}</label>
        <div><input type="text" name="subject" id="subject" value="{tmpl_var name='subject'}" class="form-control" /><small>{tmpl_var name='variables_txt'}: {tmpl_var name="message_variables"}<br />{tmpl_var name='variables_description_txt'}</small></div>
    </div>
    <div class="wb-field-group wb-field-group--with-help">
        <label for="message">{tmpl_var name='message_txt'}</label>
        <div><textarea class="form-control wb-textarea-xl" name="message" id="message">{tmpl_var name='message'}</textarea><small>{tmpl_var name='variables_txt'}: {tmpl_var name="message_variables"}<br />{tmpl_var name='variables_description_txt'}</small></div>
    </div>
</section>
<div class="wb-form-actions">
    <button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="client/message_template_edit.php">{tmpl_var name='btn_save_txt'}</button>
    <button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="client/message_template_list.php" data-load-content="client/message_template_list.php">{tmpl_var name='btn_cancel_txt'}</button>
</div>
<input type="hidden" name="id" value="{tmpl_var name='id'}">
