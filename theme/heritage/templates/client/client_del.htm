<!-- WP-963: native Workbench client surface; controller contract unchanged. -->
<div class='page-header'><h1><tmpl_var name="list_head_txt"> <tmpl_var name="contactname"></h1></div>
<tmpl_if name='number_records'>
	<tmpl_var name="delete_explanation">:<br /><br />
	<div class="wb-table-workspace">
		<table class="table wb-data-table">
		<thead >
			<tr>
				<th class="tiny-col"><tmpl_var name="table_txt"></th>
				<th class="tiny-col"><tmpl_var name="data_txt"></th>
			</tr>
		</thead>
		<tbody>
		<tmpl_loop name="records">
			<tr>
				<td>{tmpl_var name="table"} ({tmpl_var name="count"})</td>
				<td>{tmpl_var name="data"}</td>
			</tr>
		</tmpl_loop>
		</tbody>
		</table>
	</div>
</tmpl_else>
	<h3><tmpl_var name="confirm_client_delete_txt"></h3>
</tmpl_if>
&nbsp;
<div> <input type="checkbox" name="confirm" value="yes" /> <b><tmpl_var name="confirm_action_txt"></b></div>
&nbsp;
<input type="hidden" name="id" value="{tmpl_var name='id'}">
<div class="wb-form-actions"><div class="wb-form-actions__primary">
	<button class="formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="client/client_del.php">{tmpl_var name='btn_save_txt'}</button>
	<button class="formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-workbench-load-content="client/client_list.php" data-load-content="client/client_list.php">{tmpl_var name='btn_cancel_txt'}</button>
</div></div>
