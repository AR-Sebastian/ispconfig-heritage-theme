<!-- WP-963: native Workbench client surface; controller contract unchanged. -->
<div class='page-header'>
	<h1><tmpl_var name="list_head_txt"></h1>
</div>
<section class="wb-table-workspace">
    <div class="wb-list-toolbar">
        <div class="wb-list-toolbar__context">
            <span class="wb-list-toolbar__eyebrow">{tmpl_var name="toolsarea_head_txt"}</span>
            <strong><tmpl_var name="list_head_txt"></strong>
        </div>
        <button class="formbutton-success" type="button" data-workbench-load-content="client/message_template_edit.php" data-load-content="client/message_template_edit.php">{tmpl_var name="add_new_record_txt"}</button>
    </div>

<table class="table wb-data-table">
        <thead >
          <tr>
            <th data-column="template_type"><tmpl_var name="template_type_txt"></th>
            <th data-column="template_name"><tmpl_var name="template_name_txt"></th>
            <th class="wb-table-align-end">&nbsp;</th>
          </tr>
          <tr>
            <td><select class="form-control" name="search_template_type" data-submit-on-change="client/message_template_list.php" data-submit-form="pageForm">{tmpl_var name='search_template_type'}</select></td>
            <td><input class="form-control" type="text" name="search_template_name" value="{tmpl_var name='search_template_name'}" /></td>
            <td class="wb-table-align-end"><div class="buttons"><button type="button" class="formbutton-default formbutton-narrow" name="Filter" id="Filter" value="{tmpl_var name="filter_txt"}" data-submit-form="pageForm" data-form-action="client/message_template_list.php"><span class="icon icon-filter"></span></button></div></td>
          </tr>
        </thead>
        <tbody>
          <tmpl_loop name="records">
          <tr>
            <td><a href="#" data-workbench-load-content="client/message_template_edit.php?id={tmpl_var name='id'}" data-load-content="client/message_template_edit.php?id={tmpl_var name='id'}">{tmpl_var name="template_type"}</a></td>
            <td><a href="#" data-workbench-load-content="client/message_template_edit.php?id={tmpl_var name='id'}" data-load-content="client/message_template_edit.php?id={tmpl_var name='id'}">{tmpl_var name="template_name"}</a></td>
            <td class="wb-table-align-end">
              <div class="buttons icons16">
                <a class="formbutton-danger formbutton-narrow" href="#" data-confirm-action="client/message_template_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}" data-confirm-message="{tmpl_var name='delete_confirmation'}"><span class="icon icon-delete"></span></a>
              </div>
            </td>
          </tr>
          </tmpl_loop>
          <tmpl_unless name="records">
              <tr class="tbl_row_noresults tbl_row_<tmpl_if name='__EVEN__'}even<tmpl_else>uneven</tmpl_if>">
                  <td colspan="3">{tmpl_var name='globalsearch_noresults_text_txt'}</td>
              </tr>
          </tmpl_unless>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3"><tmpl_var name="paging"></td>
          </tr>
        </tfoot>
      </table>
</section>
