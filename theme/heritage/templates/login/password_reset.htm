<tmpl_if name="msg">
<div class="hg-auth-feedback hg-auth-feedback--success" role="alert"><tmpl_var name="msg"></div>
</tmpl_if>
<tmpl_if name="error">
<div class="hg-auth-feedback hg-auth-feedback--danger" role="alert"><tmpl_var name="error"></div>
</tmpl_if>
<h2><tmpl_var name="pw_reset_txt"></h2>
<p><tmpl_var name="list_desc_txt"></p>
<form class="hg-auth-form" accept-charset="UTF-8" role="form" method="post" action="password_reset.php">
<fieldset>
	<div class="hg-auth-field">
		<label class="hg-visually-hidden" for="email">{tmpl_var name='email_txt'}</label>
		<input class="form-control" placeholder="{tmpl_var name='email_txt'}" name="email" id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-required="true" autofocus>
	</div>
	<div class="hg-auth-field">
		<label class="hg-visually-hidden" for="username">{tmpl_var name='username_txt'}</label>
		<input class="form-control" placeholder="{tmpl_var name='username_txt'}" name="username" id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-required="true">
	</div>
	<input type="hidden" name="s_mod" value="login" />
	<input type="hidden" name="s_pg" value="index" />
	<div class="hg-auth-actions">
		<input class="hg-auth-secondary" type="submit" value="{tmpl_var name='pw_button_txt'}">
		<button class="hg-auth-secondary" type="button" value="{tmpl_var name='pw_lost_txt'}" data-login-navigate="index.php">{tmpl_var name='back_txt'}</button>
	</div>
</fieldset>
</form>
