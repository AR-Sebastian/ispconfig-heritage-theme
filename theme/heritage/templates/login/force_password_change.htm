<tmpl_if name="error">
	<div class="hg-auth-feedback hg-auth-feedback--danger" role="alert"><tmpl_var name="error"></div>
</tmpl_if>
<h2><tmpl_var name="force_password_change_title"></h2>
<p><tmpl_var name="force_password_change_message"></p>
<form class="hg-auth-form" accept-charset="UTF-8" role="form" method="post" action="force_password_change.php">
<fieldset>
	<div class="hg-auth-field">
		<label for="new_password"><tmpl_var name="new_password_txt"></label>
		<div class="hg-auth-composite">
			<input class="form-control" placeholder="{tmpl_var name='new_password_txt'}" name="new_password" id="new_password" type="password" autofocus required aria-required="true" autocomplete="new-password" data-heritage-password-check="new_password:confirm_password" data-heritage-password-strength="true">
			<span class="hg-auth-addon">
				<button class="hg-auth-secondary" type="button" data-generate-password="true" data-password-field="new_password" data-repeat-password-field="confirm_password">{tmpl_var name='generate_password_txt'}</button>
			</span>
		</div>
	</div>
	<div class="hg-auth-field">
		<label class="hg-auth-label">{tmpl_var name='password_strength_txt'}</label>
		<div class="checkbox">
			<div id="passBar"></div>
			<span id="passText">&nbsp;</span>
		</div>
	</div>
	<div class="hg-auth-field">
		<label for="confirm_password"><tmpl_var name="confirm_password_txt"></label>
		<input class="form-control" placeholder="{tmpl_var name='confirm_password_txt'}" name="confirm_password" id="confirm_password" type="password" required aria-required="true" autocomplete="new-password" data-heritage-password-check="new_password:confirm_password">
	</div>
	<div class="hg-auth-field">
		<div id="confirmpasswordError" hidden class="confirmpassworderror">{tmpl_var name='password_mismatch_txt'}</div>
		<div id="confirmpasswordOK" hidden class="confirmpasswordok">{tmpl_var name='password_match_txt'}</div>
	</div>
	<div class="hg-auth-actions">
		<input class="hg-auth-primary" type="submit" value="{tmpl_var name='change_password_button_txt'}">
	</div>

	<input type="hidden" name="_csrf_id" value="{tmpl_var name='_csrf_id'}" />
	<input type="hidden" name="_csrf_key" value="{tmpl_var name='_csrf_key'}" />

</fieldset>
</form>
