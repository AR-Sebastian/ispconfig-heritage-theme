name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install release tooling
        run: sudo apt-get update && sudo apt-get install --yes zip
      - name: Validate tag and version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Build assets
        run: bash scripts/build-release.sh
      - name: Verify reproducible release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          sha256sum dist/ispconfig-heritage-theme-"$version".zip \
            dist/ispconfig-heritage-theme-"$version".tar.gz > /tmp/heritage-first-build.sha256
          bash scripts/build-release.sh
          sha256sum dist/ispconfig-heritage-theme-"$version".zip \
            dist/ispconfig-heritage-theme-"$version".tar.gz > /tmp/heritage-second-build.sha256
          diff -u /tmp/heritage-first-build.sha256 /tmp/heritage-second-build.sha256
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if unzip -Z1 dist/ispconfig-heritage-theme-"$version".zip | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'ZIP archive contains an unsafe path.' >&2
            exit 1
          fi
          if tar -tzf dist/ispconfig-heritage-theme-"$version".tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'TAR.GZ archive contains an unsafe path.' >&2
            exit 1
          fi
          test -f "RELEASE_NOTES_$version.md"
          cp "RELEASE_NOTES_$version.md" dist/RELEASE_NOTES.md
      - name: Build SPDX SBOM
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/generate-sbom.js theme/heritage "dist/ispconfig-heritage-theme-$version.spdx.json"
      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/ispconfig-heritage-theme-*.zip
            dist/ispconfig-heritage-theme-*.tar.gz
            dist/SHA256SUMS.txt
            dist/ispconfig-heritage-theme-*.spdx.json
      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/ispconfig-heritage-theme-*.zip
            dist/ispconfig-heritage-theme-*.tar.gz
          sbom-path: dist/ispconfig-heritage-theme-${{ env.RELEASE_VERSION }}.spdx.json
      - name: Publish assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/ispconfig-heritage-theme-*.zip
            dist/ispconfig-heritage-theme-*.tar.gz
            dist/SHA256SUMS.txt
            dist/ispconfig-heritage-theme-*.spdx.json
      - name: Verify published assets
        run: bash scripts/verify-published-release.sh "${GITHUB_REF_NAME#v}" --require-attestation --require-sbom
